# Cloudflare Worker behind the "ask me anything" terminal on mayukh-d.github.io.
# Secret (set once, never committed):  npx wrangler secret put GEMINI_API_KEY
name = "mayukh-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://mayukh-d.github.io,http://localhost:8765,http://127.0.0.1:8765"

# Per-visitor cap: 6 questions a minute from one IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
