name: refresh Scholar numbers

on:
  schedule:
    - cron: "41 21 * * *"   # daily, 07:41 in Canberra
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/scholar.json index.html; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh Scholar numbers"
          git push
